function useActiveSection(ids){
  const [active,setActive] = useState(ids[0]);
  useEffect(()=>{
    const els = ids.map(id=>document.getElementById(id)).filter(Boolean);
    if(!('IntersectionObserver' in window) || !els.length) return;
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting) setActive(e.target.id); });
    }, {rootMargin:"-45% 0px -50% 0px"});
    els.forEach(el=>io.observe(el));
    return ()=> io.disconnect();
  },[]);
  return active;
}

function TypeCycle({words, typingSpeed=55, deletingSpeed=28, pause=1400}){
  const [text,setText] = useState("");
  const [i,setI] = useState(0);
  const [deleting,setDeleting] = useState(false);
  useEffect(()=>{
    const full = words[i % words.length];
    let t;
    if(!deleting && text.length < full.length){
      t = setTimeout(()=> setText(full.slice(0,text.length+1)), typingSpeed);
    } else if(!deleting && text.length === full.length){
      t = setTimeout(()=> setDeleting(true), pause);
    } else if(deleting && text.length > 0){
      t = setTimeout(()=> setText(full.slice(0,text.length-1)), deletingSpeed);
    } else {
      setDeleting(false);
      setI((i+1) % words.length);
    }
    return ()=> clearTimeout(t);
  },[text,deleting,i]);
  return <span className="type-wrap">{text}<span className="type-cursor"></span></span>;
}

function Chevron({open}){
  return <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8l5 5 5-5" stroke="currentColor" strokeWidth="2" fill="none"/></svg>;
}

function useReveal(){
  const ref = useRef(null);
  const [visible,setVisible] = useState(false);
  useEffect(()=>{
    const el = ref.current;
    if(!el) return;
    if(!('IntersectionObserver' in window)){ setVisible(true); return; }
    const io = new IntersectionObserver((entries)=>{
      if(entries[0].isIntersecting){ setVisible(true); io.unobserve(el); }
    }, {threshold:.12});
    io.observe(el);
    const t = setTimeout(()=>setVisible(true), 2500);
    return ()=>{ io.disconnect(); clearTimeout(t); };
  },[]);
  return [ref, visible];
}

function Reveal({as:Tag="div", className="", children}){
  const [ref, visible] = useReveal();
  return <Tag ref={ref} className={"reveal" + (visible ? " in" : "") + (className ? " " + className : "")}>{children}</Tag>;
}

}
